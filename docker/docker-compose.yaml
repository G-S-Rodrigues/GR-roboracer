# Named docker-compose.yaml, not compose.yaml. Compose v2 reads both.
#
# All ROS nodes run in `dev`. The default services have deliberately no
# cross-container DDS and no network_mode: host -- `fast-sim` is a separate
# container precisely because it contains no ROS at all, so the two never need
# to discover each other. The `autodrive` profile is the one exception: its
# devkit is a ROS 2 Humble container that talks DDS to `dev` (Jazzy). Start its
# services by name with --no-deps, never a bare `up`: the project name is shared
# and a bare `up` from a worktree can recreate the shared `dev` container.
name: gr-roboracer

services:
  dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: dev
    image: gr-roboracer:dev
    container_name: gr-roboracer-dev
    working_dir: /ws
    volumes:
      - ..:/ws
      # Named volumes over the generated trees. This keeps tens of thousands of
      # files out of the editor's indexer and stops dev and fast-sim clobbering
      # each other's artifacts.
      - ws-build:/ws/build
      - ws-install:/ws/install
      - ws-log:/ws/log
      # WSLg / X11 passthrough for RViz.
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /mnt/wslg:/mnt/wslg
    environment:
      # Fixed so two developers on one network do not cross-talk.
      ROS_DOMAIN_ID: "42"
      # RMW_IMPLEMENTATION is deliberately left at the Jazzy default.
      # The container runs as root while the WSL bind mount is owned by UID
      # 1000. Tell Git this one workspace is trusted without changing global
      # configuration or disabling the ownership check for other paths.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /ws
      DISPLAY: ${DISPLAY:-:0}
      WAYLAND_DISPLAY: ${WAYLAND_DISPLAY:-}
      # Not ${XDG_RUNTIME_DIR:-...}: a WSL host always exports its own
      # /run/user/<uid>, which does not exist in here, so the fallback never
      # applied and RViz found no runtime dir. WSLg's is the mounted one.
      XDG_RUNTIME_DIR: /mnt/wslg/runtime-dir
      PULSE_SERVER: ${PULSE_SERVER:-}
    stdin_open: true
    tty: true
    command: sleep infinity

  fast-sim:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: fast-sim
    image: gr-roboracer:fast-sim
    container_name: gr-roboracer-fast-sim
    working_dir: /ws
    volumes:
      - ..:/ws
      # racing_common remains one C++ implementation. Consume the dev build
      # read-only rather than growing a second Python Frenet implementation.
      - ws-build:/ws/build:ro
      - ws-install:/ws/install:ro
    environment:
      PYTHONPATH: /ws/install/racing_common/lib/python3.12/site-packages:/ws/install/racing_controller_baseline/lib/python3.12/site-packages
      LD_LIBRARY_PATH: /ws/install/racing_common/lib:/ws/install/racing_controller_baseline/lib
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # The official AutoDRIVE RoboRacer simulator, headless, by digest (see
  # config/autodrive/simulator.yaml). It is a Socket.IO client that connects
  # once and never retries, so it waits for the bridge port first. Every shell
  # `$` is `$$`: compose interpolates a bare `$` from the host's environment.
  # The image's entrypoint is /bin/bash, hence the leading -c.
  autodrive-sim:
    extends:
      file: ../config/autodrive/simulator.yaml
      service: sim
    profiles: [autodrive]
    container_name: gr-roboracer-autodrive-sim
    working_dir: /home/autodrive_simulator
    environment:
      AUTODRIVE_BRIDGE_HOST: ${AUTODRIVE_BRIDGE_HOST:-autodrive-devkit}
    command:
      - -c
      - >-
        until (exec 3<>/dev/tcp/$$AUTODRIVE_BRIDGE_HOST/4567) 2>/dev/null;
        do sleep 0.5; done;
        exec "./AutoDRIVE Simulator.x86_64" -batchmode -nographics
        -ip $$(getent hosts $$AUTODRIVE_BRIDGE_HOST | cut -d' ' -f1)
        -port 4567

  # The official devkit (ROS 2 Humble) with its Socket.IO bridge, unmodified.
  # Its default domain is dev's 42; override AUTODRIVE_ROS_DOMAIN_ID to keep a
  # second stack off it.
  autodrive-devkit:
    extends:
      file: ../config/autodrive/simulator.yaml
      service: devkit
    profiles: [autodrive]
    container_name: gr-roboracer-autodrive-devkit
    working_dir: /home/autodrive_devkit
    environment:
      ROS_DOMAIN_ID: ${AUTODRIVE_ROS_DOMAIN_ID:-42}
    command:
      - -c
      - >-
        source /opt/ros/humble/setup.bash && source install/setup.bash &&
        exec ros2 launch autodrive_roboracer bringup_headless.launch.py

volumes:
  ws-build:
  ws-install:
  ws-log:
