[project]
name = "gr-roboracer-sim"
version = "0.1.0"
description = "ROS-free headless simulator for GR-roboracer"
requires-python = ">=3.12,<3.14"
dependencies = [
  "f1tenth-gym-jax[cuda] @ git+https://github.com/f1tenth/f1tenth_gym_jax@1b4eb3f5161756bb925987753b965b549097742f",
  "numpy>=2.0,<3",
  "pillow>=11,<12",
  "pyyaml>=6,<7",
]

[tool.uv]
override-dependencies = [
  "jax>=0.7.2,<0.8",
  "jax-pf @ git+https://github.com/hzheng40/jax_pf@1b1417d7d2afbf24a9c6594195c2e872a6b4460a",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
