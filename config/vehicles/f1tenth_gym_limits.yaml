# The gym-limits vehicle: every cap is the simulator's own (f1tenth_gym_jax
# `Param`), so a raceline planned for it asks nothing the simulated car cannot
# do. Same sections and keys as f1tenth_default.yaml (BRINGUP-1100 guards that;
# a missing key silently falls back to the node's declare_parameter default).
# Bump the version string in racing_metrics/racing_recording below whenever a
# value here changes, so a metrics record can be attributed to this file.
#
# Where each number comes from (SIMJAX-1120 pins them to Param):
#   maximum_steering_angle 0.4189  Param.s_max
#   maximum_steering_rate  3.2     Param.sv_max
#   maximum_acceleration   9.51    Param.a_max (the gym also clips braking at -a_max)
#   vehicle_half_width     0.155   Param.width / 2
#   wheelbase              0.3302  Param.lf + Param.lr
#   maximum_speed          8.0     the owner's "8 m/s gym-limits vehicle"; the gym's
#                                  own ceiling is Param.v_max = 20.0
# The GGV and ax_max_machines tables beside this file (f1tenth_gym_limits/) are the
# gym's longitudinal model (SIMJAX-1130). ay = mu * g is a MODELLING BOUND: the
# gym's `st` tyres are linear and never saturate, so the real lateral limit is
# higher and a profile may be slower than the gym allows, never faster than the
# declared bound.
#
# Reference point: the gym's `st` state is the centre of gravity (axles at
# x = -lr = -0.17145 and +lf = +0.15875). Since part 3.1 the sim publishes its
# pose at base_link, the rear axle (the URDF's wheels at 0 and 0.33), and the
# URDF's cog_link marks the CoG. The default file keeps wheelbase 0.33 (0.2 mm,
# 0.06 % of kappa_max below this file's 0.3302). Pure Pursuit steers cog_link
# by default (launch argument pure_pursuit_reference); base_link, the rear axle
# its geometry assumes, is the selectable option (owner rulings 2026-10-13
# and 2026-10-15).
#
# No gate lap runs on this vehicle (owner ruling 2026-10-11): it runs nightly
# only, and gate laps use f1tenth_default.yaml.

racing_sim:
  ros__parameters:
    # base_link -> laser: the URDF joint base_link_to_laser's origin
    # (racing_vehicle_description/urdf/f1tenth.urdf), planar part only.
    # BRINGUP-1050 fails if these and the URDF disagree.
    laser_x: 0.275
    laser_y: 0.0
    laser_yaw: 0.0

racing_controller_baseline:
  ros__parameters:
    wheelbase: 0.3302
    lookahead_distance: 1.0
    minimum_speed: 0.5
    maximum_speed: 8.0
    curvature_speed_gain: 1.0
    closed_trajectory: true

racing_safety_supervisor:
  ros__parameters:
    maximum_speed: 8.0
    maximum_steering_angle: 0.4189
    maximum_acceleration: 9.51
    maximum_steering_rate: 3.2
    vehicle_half_width: 0.155
    # Never widen this to cure a latch (repo-gotchas #19): a latched stop means
    # the command stream really stalled, or the estimator was not up yet.
    stale_input_timeout_ms: 100
    track_path: config/tracks/analytic_circle.yaml

racing_bringup_support:
  ros__parameters:
    track_path: config/tracks/analytic_circle.yaml
    raceline_path: config/scenarios/maps/analytic_circle/analytic_circle_raceline.csv

racing_metrics:
  ros__parameters:
    track_path: config/tracks/analytic_circle.yaml
    scenario_id: baseline
    track_version: analytic_circle-v1
    vehicle_parameter_version: f1tenth-gym-limits-v1

racing_recording:
  ros__parameters:
    scenario_id: baseline
    track_version: analytic_circle-v1
    vehicle_parameter_version: f1tenth-gym-limits-v1
