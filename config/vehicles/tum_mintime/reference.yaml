# Reference for the TUM minimum-time parameter files, one per vehicle:
#   <vehicle>/tum_mintime.yaml                    the "dynamics" keys below
#   <vehicle>/tum_mintime_tyres_<set>.yaml        the "tyres" keys below
# This file documents them and carries no values; the loader never reads it,
# and RACELINE-1410 asserts its key sets equal every vehicle's tum_mintime.yaml
# and the F1TENTH tyre files', both ways.
# The runtime files carry no comments, so the numbers are read as data.
# Names are TUM's (racecar_f110.ini [vehicle_params_mintime] and
# [tire_params_mintime]). Derived quantities (mue, f_drive_max, f_brake_max,
# power_max, delta_max) are not stored: raceline.optimize derives them from
# the vehicle's GGV tables and steering limit.
# Source for every dynamics value, both F1TENTH vehicles: f1tenth_gym_jax Param
# @1b4eb3f (raceline/README.md "Gym vehicle parameters"), unless noted.
dynamics:
  mass:  # kg, total mass; Param.m 3.74
  I_z:  # kg m^2, yaw inertia; Param.I 0.04712
  wheelbase_front:  # m, CoG to front axle; Param.lf
  wheelbase_rear:  # m, CoG to rear axle; Param.lr. lf + lr is 0.3302; the default vehicle file says wheelbase 0.33 (0.2 mm)
  cog_z:  # m, CoG height; Param.h 0.074
  length:  # m, body length; Param.length 0.58
  track_width_front:  # m, front track; part-8 harness constant 0.281 (step1.py), both vehicles
  track_width_rear:  # m, rear track; as track_width_front
  k_brake_front:  # 1, share of brake force on the front axle; ForzaETH f110 ini 0.5
  k_drive_front:  # 1, share of drive force on the front axle; 0.0, the gym car is rear driven
  k_roll:  # 1, share of roll stiffness on the front axle; ForzaETH f110 ini 0.5
  t_delta:  # s, steering actuator time constant; ForzaETH f110 ini 0.1
  t_drive:  # s, drive force time constant; ForzaETH f110 ini 0.1
  t_brake:  # s, brake force time constant; ForzaETH f110 ini 0.1
  c_roll:  # 1, rolling resistance coefficient; 0.0, the gym has none
  liftcoeff_front:  # kg/m, front downforce coefficient; 0.0, the gym has no aerodynamics
  liftcoeff_rear:  # kg/m, rear downforce coefficient; 0.0, the gym has no aerodynamics
tyres:
  f_z0:  # N, nominal wheel load of the Pacejka fit; ForzaETH f110 ini 8.6, both sets
  B_front:  # 1, Pacejka stiffness factor; set forzaeth_f110 7.4 (identified on the real car), set gym_fit Param.C_Sf / C = 4.718 / 1.2
  C_front:  # 1, Pacejka shape factor; 1.2, both sets
  eps_front:  # 1, load sensitivity of the friction coefficient; -0.1, both sets
  E_front:  # 1, Pacejka curvature factor; 0.85, both sets
  B_rear:  # 1, Pacejka stiffness factor; set forzaeth_f110 7.4, set gym_fit Param.C_Sr / C = 5.4562 / 1.2
  C_rear:  # 1, Pacejka shape factor; 1.2, both sets
  eps_rear:  # 1, load sensitivity of the friction coefficient; -0.1, both sets
  E_rear:  # 1, Pacejka curvature factor; 0.85, both sets
# autodrive_roboracer/tum_mintime.yaml (part 8 addendum, 2026-10-31): source per
#   key; ASSUMPTION marks a value no AutoDRIVE source gives.
#   Sources: SRC = config/vehicles/autodrive_roboracer/source.yaml, ID =
#     identified.yaml, VEH = config/vehicles/autodrive_roboracer.yaml;
#   prefab/VC = Tinker-Twins/AutoDRIVE@75b7df5
#     Assets/Prefabs/F1TENTH/F1TENTH.prefab and
#     Assets/Scripts/VehicleController.cs (the SHA SRC pins).
#   mass 3.47: SRC values.sprung_mass_kg (prefab :31647 m_Mass), the Rigidbody
#     PhysX integrates; a WheelCollider.mass (SRC wheel_mass_kg 0.109 x4) is not
#     chassis mass. Unity's WheelCollider docs are silent on adding it (A1), so
#     the sprung mass stands; the alternative is SRC total_mass_kg 3.906.
#   I_z 0.03264: ASSUMPTION. SRC yaw_inertia is null (prefab :31660
#     m_ImplicitTensor 1, PhysX computes it from a MeshCollider). Scaled from
#     the gym's 0.04712 (raceline/README.md "Gym vehicle parameters") by mass
#     and body extent: 0.04712 x (3.47/3.74) x
#     ((0.50^2+0.27^2)/(0.58^2+0.31^2)). Not modelled: Rigidbody angular drag
#     0.1 (SRC angular_drag, prefab :31649).
#   wheelbase_front 0.17468: VEH racing_controller_baseline.wheelbase 0.33 (=
#     SRC wheelbase_m) minus lr 0.15532; check_dynamics holds lf + lr to VEH's
#     wheelbase within 1 mm.
#   wheelbase_rear 0.15532: SRC com_x_lr_m; VEH header "lr = 0.15532".
#   cog_z 0.07354: ID measurements.rest_height.value (n 12242); VEH header "h =
#     0.0735".
#   length 0.5: SRC body_length_m.
#   track_width_front 0.236: SRC track_width_m; the four WheelCollider
#     transforms in the prefab sit at x = +-0.118.
#   track_width_rear 0.236: as track_width_front (one value for both axles).
#   k_brake_front 0.5: prefab :31691 brakeType 0 = CAWB; VC applies the same
#     BrakeTorque to all four wheels, so half is on the front axle.
#     MonoBehaviour field, not read from the build.
#   k_drive_front 0.5: prefab :31690 driveType 5 = CAWD; VC gives DriveTorque/4
#     to each wheel. MonoBehaviour field, not read from the build. (The F1TENTH
#     gym car is rear driven: 0.0.)
#   k_roll 0.5: four WheelColliders with spring 500 (SRC suspension_spring),
#     equal track front and rear, no anti-roll bar in VC.
#   t_delta 0.349067: delta_max / t_delta bounds the steering rate; delta_max
#     0.5236 (VEH maximum_steering_angle) over min(VEH maximum_steering_rate
#     1.5, ID steering.slew 3.2) = 1.5 rad/s. Goes stale silently if VEH
#     maximum_steering_rate changes.
#   t_drive 0.1: ASSUMPTION. The sim has no force-rate limit (VC sets
#     DriveTorque every physics step, fixed step 0.001 s from
#     AutoDRIVE@75b7df5's TimeManager, not read from the build) and the stack
#     has no jerk cap; 0.1 is the value both F1TENTH files use.
#   t_brake 0.1: ASSUMPTION. As t_drive (VC applies the brake torque directly).
#   c_roll 0.0: WheelColliders model no rolling resistance. ID
#     throttle_gain.by_throttle gives v = throttle x gain; a line v = a x
#     throttle + b over its four points has a 24.755, b +0.0092 m/s (a constant
#     resistance would make b negative). Not modelled: Rigidbody linear drag
#     0.273 (SRC linear_drag), which TUM has no term for.
#   liftcoeff_front 0.0: no script attached to the F1TENTH prefab applies an
#     aerodynamic force (AutomobileController, the one with downForce, is not
#     attached).
#   liftcoeff_rear 0.0: as liftcoeff_front.
# autodrive_roboracer/tum_mintime_tyres_gym_fit.yaml (part AT, 2026-11-01):
#   a STAND-IN, byte-identical to f1tenth_default's gym_fit set (every value
#   and source as in "tyres:" above). NOT identified from AutoDRIVE: the
#   owner tunes it (ruling N1). The name stays gym_fit because the set is
#   chosen globally (raceline.optimize.MINTIME_TYRE_SET) and a new name is a
#   code change. f_z0 8.6 is the ForzaETH f110 ini's nominal load (as in
#   "tyres:" above), not either car's; AutoDRIVE's static wheel load is
#   3.47 x 9.81 / 4 = 8.51 N (SRC sprung_mass_kg, = tum_mintime.yaml mass).
#   Tuning inputs AutoDRIVE exposes, NOT converted to Pacejka (the Unity
#   WheelCollider -> Pacejka mapping is undocumented and needs a fit to
#   cornering data; Porto has no room for a skidpad):
#   friction_forward: extremum (slip 0.15, value 0.9), asymptote (0.25,
#     0.58), stiffness 0.8. SRC friction_forward (prefab :31433, read from
#     the build).
#   friction_sideways: extremum (0.01, 1.0), asymptote (0.1, 0.5),
#     stiffness 1.0. SRC friction_sideways (prefab :31439, read from build).
#   WheelCollider force = curve value x stiffness x load, so mu_lateral 1.0
#     (SRC mu_lateral) is the ggv's ay bound (ggv.csv: ay 9.81, a modelling
#     bound, never measured).
#   The floor's PhysicMaterial does not act on WheelColliders (Unity docs):
#     the curves are the whole tyre-road model.
#   Drive: SRC motor_torque_nm 428 (scene; not read from the build), brake
#     torque = motor torque (VC :172 "BrakeTorque = MotorTorque", at
#     AutoDRIVE@75b7df5; not in SRC), wheel_radius_m 0.059. Measured: ID
#     burst_acceleration 5.20 m/s^2 (first 0.25 s), braking_deceleration
#     6.34 m/s^2 (depends on speed; 5.7-8.6 by initial speed). The ggv's ax
#     is the supervisor cap 2.0, not the machine.
