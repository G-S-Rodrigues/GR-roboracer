# The AutoDRIVE league car with the fast caps (RoboRacer Sim Racing, edition 2026-iros-practice),
# for `simulator:=autodrive` (part 8). NOT for the gym, which simulates a
# different car. Same sections and keys as f1tenth_default.yaml (BRINGUP-1100).
# Bump the version string in racing_metrics/racing_recording below whenever a
# value here changes.
#
# Where each number comes from (config/vehicles/autodrive_roboracer/):
#   geometry   source.yaml, each value with a pinned line anchor: wheelbase
#              0.324 (wheelbase_table_m, guide :180, = the prefab's Ackermann
#              field 324 mm; owner 2026-11-01; the TF/collider wheel x 0.33
#              and the identified effective 0.339 sit beside it), half width
#              0.135 (guide), steering angle 0.5236 (guide and prefab), laser
#              mount 0.2733 (guide TF).
#   caps       speed 4.5, acceleration 4.0, steering rate 1.5 (unchanged):
#              owner ruling 2026-11-08 for the fast min-time lap on Porto.
#              autodrive_roboracer.yaml (caps 3.0 / 2.0) stays Porto
#              qualification's car; this file is added beside it (ADR 0005).
#   not here   top speed: not measured on Porto (the longest straight, about
#              8 m, reaches a highest steady 2.977 m/s at throttle 0.12). The
#              guide's 22.88 m/s is in source.yaml, unverified. Braking depends
#              on speed (8.4 / 5.8 / 6.0 m/s^2 from 0.5 / 3 / 4.9 m/s, mean
#              6.34), so no single deceleration is claimed.
#
# Reference point (repo-gotchas #26): AutoDRIVE's pose is the REAR AXLE;
# base_link is the CoG, lr = 0.15532 ahead, at h = 0.0735.
# laser_x is the true 0.2733 and matches this vehicle's own description
# (racing_vehicle_description/urdf/autodrive_roboracer.urdf, rear axle 0.15532
# behind base_link). BRINGUP-1050 skips this file (NOT_GYM_CAST); BRINGUP-1057
# pins it to that URDF.

racing_sim:
  ros__parameters:
    laser_x: 0.2733
    laser_y: 0.0
    laser_yaw: 0.0

racing_controller_baseline:
  ros__parameters:
    wheelbase: 0.324
    lookahead_distance: 1.0
    minimum_speed: 0.5
    maximum_speed: 4.5
    curvature_speed_gain: 1.0
    closed_trajectory: true

racing_safety_supervisor:
  ros__parameters:
    maximum_speed: 4.5
    maximum_steering_angle: 0.5236
    maximum_acceleration: 4.0
    maximum_steering_rate: 1.5
    vehicle_half_width: 0.135
    # 200 ms on AutoDRIVE, 100 on the gym (owner call #27, 2026-11-11). The
    # sim runs on wall time (no held /clock), and its frame gaps are delivery
    # delays: the car keeps moving on the last command through them. Measured
    # here: max 97.6 ms for the sim alone at load 6.4; 127 and 132 ms with the
    # full stack plus MOLA (both latched at 100); 144.5 ms in the recorded
    # fixture. 200 is about 2x the sim-alone worst; at 4.5 m/s it is 0.9 m
    # blind. A latch still means the stream stalled: find the stall (gotchas
    # 19, 31). Never widen this to cure a latch.
    stale_input_timeout_ms: 200
    track_path: config/tracks/analytic_circle.yaml

racing_bringup_support:
  ros__parameters:
    track_path: config/tracks/analytic_circle.yaml
    raceline_path: config/scenarios/maps/analytic_circle/analytic_circle_raceline.csv

racing_metrics:
  ros__parameters:
    track_path: config/tracks/analytic_circle.yaml
    scenario_id: baseline
    track_version: analytic_circle-v1
    vehicle_parameter_version: autodrive-roboracer-fast-v1

racing_recording:
  ros__parameters:
    scenario_id: baseline
    track_version: analytic_circle-v1
    vehicle_parameter_version: autodrive-roboracer-fast-v1
