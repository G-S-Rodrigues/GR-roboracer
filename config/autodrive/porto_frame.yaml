# Where AutoDRIVE's world frame sits in the Porto map frame
# (config/tracks/porto.yaml), for `simulator:=autodrive` (#44 part 8, plan D3,
# ruled 2026-10-30 ~12:35).
#
# MEASURED (part 10, 2026-10-31, run at 66eb28c): 12 live laps, 29902 lidar
# endpoints fitted to Porto.pgm's walls (racing_evaluation.frame_fit,
# tools/autodrive_frame_measure.py). The correction to the derived
# (-2.9, 1.2, pi/2) was dx +0.061, dy -0.022, dyaw +0.0028 rad, residual
# 0.062 m, thirds of the run agreeing to 0.001 m / 0.003 rad.
#
# The map pose is the world pose rotated by `yaw` then shifted:
#   x_map = cos(yaw)*x_world - sin(yaw)*y_world + x
#   y_map = sin(yaw)*x_world + cos(yaw)*y_world + y
#   yaw_map = yaw_world + yaw
# which at yaw = pi/2 is x_map = -y_world + x, y_map = x_world + y. A proper
# rotation, no reflection. The fixture's spawn CoG (0.8013, 3.0030, yaw 3pi/2)
# lands at (-5.845, 1.971) facing yaw 0.003 on the straight.
#
# Two independent fits agree (offline, 2026-10-30):
#   1. ICP of the scene's 21 Porto checkpoints against porto.yaml's
#      centerline: 90.36 deg, t = (-2.92, 1.17).
#   2. Scan matching of 14 fixture scans against Porto.pgm: 90.0 deg,
#      t = (-2.76, 1.22), median residual 0.084 m.
# Uncertainty: x (along the track, weakly observable) +-0.15 m, y +-0.03 m.
#
# The sim races clockwise, and since part 10 porto.yaml's centerline runs
# clockwise too (extracted --direction cw), so SIMAD-1350 holds the spawn on
# the track facing along it. The fit is the lidar's, so it holds the wall
# distances; the derived value agreed (offline ICP -2.92/1.17, scan match
# -2.76/1.22), and SIM-3730 re-checks the spawn against this file.
measured: measured
world_to_map:
  x: -2.8424
  y: 1.1700
  yaw: 1.57361
