# The track survey: slam_toolbox's async mapper laying /scan at exact poses,
# which produces the occupancy grid nav2_map_server serves to nav2_amcl
# (config/scenarios/maps/<track>/slam/). Regenerated by scripts/map_track.sh.
# Values not set here are slam_toolbox's own defaults
# (mapper_params_online_async.yaml).
#
# The grid is a localization *fixture*, not a measurement - as the track's
# own PNG is - so it is surveyed the way that PNG is exact: on the track's
# exact-sensor scenario (config/scenarios/spielberg_survey.yaml, no odometry
# noise), with the scan matcher off, so every node sits at the true
# dead-reckoned pose. Karto's free matcher drifts instead: 3.2 m of pose
# error and a 0.13 m rigid-fit median over one Spielberg lap from exactly
# these inputs (plan D7).
#
# It never publishes map -> odom (transform_publish_period: 0): the survey
# run drives on ground truth and the support node keeps owning map -> odom.
# Dead reckoning starts at the true pose and has no noise here, so
# slam_toolbox's map frame is the track's map frame and the grid is aligned
# with the track's own.
slam_toolbox:
  ros__parameters:
    use_sim_time: true
    mode: mapping
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    # The sensor a real car localizes on, not /ground_truth/scan: its
    # sigma-0.03 m noise averages out over a lap's hits (the surveyed grid
    # fits the track PNG to a 0.043 m boundary median either way).
    scan_topic: /scan
    transform_publish_period: 0.0
    resolution: 0.05
    # The sim reports "no return" as range_max (10 m), not inf: a reading at
    # the maximum is not a wall, so it is excluded below it.
    max_laser_range: 9.5
    # The nodes are placed by odometry alone, which is exact here; matching
    # and loop closure could only move them off the truth. The resulting
    # pose graph has no vertices and is therefore not localizable - which
    # is why nothing loads it, and why only the grid is committed (D7).
    use_scan_matching: false
    do_loop_closing: false
    # Throttled by slam_toolbox's own travel thresholds, never a throttle
    # node: /scan arrives at 100 Hz, and a graph node per scan is a stall
    # long enough to latch the supervisor (repo-gotchas #19).
    minimum_travel_distance: 0.2
    minimum_travel_heading: 0.1
    minimum_time_interval: 0.0
    map_update_interval: 5.0
    stack_size_to_use: 40000000
