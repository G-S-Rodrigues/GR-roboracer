# Pipeline for sm2mm: build the localization map (a 5 cm CVoxelMap layer
# named `localmap`) from MOLA's simplemap keyframes.
generators:
  - class_name: mp2p_icp_filters::Generator
    params:
      target_layer: "localmap"
      throw_on_unhandled_observation_class: false
      process_class_names_regex: ".*"
      process_sensor_labels_regex: ".*"
      metric_map_definition:
        class: mrpt::maps::CVoxelMap
        creationOpts:
          resolution: 0.05
        insertOpts:
          prob_miss: 0.30
          prob_hit: 0.70
          clamp_min: 0.05
          clamp_max: 0.95
          ray_trace_free_space: true
          decimation: 1
        likelihoodOpts:
          occupiedThreshold: 0.60
