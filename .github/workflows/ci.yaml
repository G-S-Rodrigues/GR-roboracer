# Two gates, deliberately unequal.
#
# The PR gate is small on purpose: tiers 0-2 plus one seeded tier-3 lap, aimed
# at ~3 minutes. "Everything on every PR" was considered and rejected -- at 20+
# minutes a gate gets bypassed, and a gate you bypass is worth less than a
# smaller one you don't. The nightly job is where the full tier-3/4 suites and
# the multi-seed sweep run, because that is work nobody is waiting on.
#
# Note that the local pre-commit hook (scripts/check.sh --fast) matters more
# than either job here: CI feedback arrives after a mistake has been built on.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # 03:00 UTC daily.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      # TEMPORARY (fix part N1): runs only the n1-repro job. Reverted before the PR.
      n1_repro:
        description: "Run only the N1 ACC-4010 repro loop"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-gate:
    name: Tiers 0-2 + one seeded lap
    if: github.event_name != 'schedule' && !inputs.n1_repro
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Loaded into the local daemon rather than pushed: nothing outside this
      # job consumes the image, and the underlay layer is the expensive one to
      # rebuild, so it is the one worth caching.
      - name: Build the dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: dev
          tags: gr-roboracer:dev
          load: true
          cache-from: type=gha,scope=dev
          cache-to: type=gha,mode=max,scope=dev

      - name: check.sh --ci
        run: |
          docker run --rm \
            --volume "$PWD:/ws" \
            --workdir /ws \
            --env ROS_DOMAIN_ID=42 \
            gr-roboracer:dev ./scripts/check.sh --ci

  nightly:
    name: Tiers 3-4 (tier 5 on seed 42), seed ${{ matrix.seed }}
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && !inputs.n1_repro
    runs-on: ubuntu-latest
    # The seed-42 leg runs tier 5 as well, and tier 5 is laps, not seconds.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        # 42 and 1030 are the seeds the committed tier-3 tests pin; the others
        # exist so a controller that only survives the seeds it was tuned
        # against fails here rather than on a track.
        seed: [42, 1030, 7, 2026]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: dev
          tags: gr-roboracer:dev
          load: true
          cache-from: type=gha,scope=dev
          cache-to: type=gha,mode=max,scope=dev

      - name: check.sh --full
        if: matrix.seed != 42
        run: |
          docker run --rm \
            --volume "$PWD:/ws" \
            --workdir /ws \
            --env ROS_DOMAIN_ID=42 \
            --env ROS_LOG_DIR=/ws/log/ros \
            gr-roboracer:dev ./scripts/check.sh --full

      # Tier 5 on one leg only, and as a replacement for --full on that leg
      # rather than an addition to it. It comes before the seeded lap because
      # it is the seed-42 leg's only workspace build, and the lap needs the
      # built overlay (the bind mount carries build/ and install/ across).
      # --nightly already runs everything --full does, and the cross-product
      # is the cost ADR 0005 keeps out of the gate - running it once per
      # matrix seed would square it.
      - name: check.sh --nightly
        if: matrix.seed == 42
        run: |
          docker run --rm \
            --volume "$PWD:/ws" \
            --workdir /ws \
            --env ROS_DOMAIN_ID=42 \
            --env ROS_LOG_DIR=/ws/log/ros \
            gr-roboracer:dev ./scripts/check.sh --nightly

      # Node logs and Robot Framework output, kept only for a red leg. The CI
      # log carries no node output, so a latched stop on a runner left no
      # evidence beyond the observer's one-line description.
      - name: Upload the failed run's node and Robot logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-seed-${{ matrix.seed }}
          path: |
            log/ros/
            log/robot/
          if-no-files-found: warn

      - name: Upload SIM-5030's sample
        if: always() && matrix.seed == 42
        uses: actions/upload-artifact@v4
        with:
          name: sim-5030
          path: |
            log/sim-5030.json
            log/sim-5030-max.jsonl
          if-no-files-found: ignore

      - name: Upload the run's metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-seed-${{ matrix.seed }}
          path: log/scenario-seed-${{ matrix.seed }}.json
          if-no-files-found: warn

      - name: One seeded lap on this matrix seed
        run: |
          docker run --rm \
            --volume "$PWD:/ws" \
            --workdir /ws \
            --env ROS_DOMAIN_ID=42 \
            --env ROS_LOG_DIR=/ws/log/ros \
            gr-roboracer:dev ./scripts/run_scenario.py \
              --seed ${{ matrix.seed }} \
              --output log/scenario-seed-${{ matrix.seed }}.json

  # TEMPORARY (fix part N1): loops ACC-4010 on a real runner to capture the
  # startup stale-input latch the observer describes. Dispatch-only.
  n1-repro:
    name: N1 repro, leg ${{ matrix.leg }}
    if: github.event_name == 'workflow_dispatch' && inputs.n1_repro
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        leg: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: dev
          tags: gr-roboracer:dev
          load: true
          cache-from: type=gha,scope=dev
          cache-to: type=gha,mode=max,scope=dev

      - name: Loop ACC-4010 twenty times
        run: |
          docker run --rm \
            --volume "$PWD:/ws" \
            --workdir /ws \
            --env ROS_DOMAIN_ID=42 \
            --env ROS_LOG_DIR=/ws/log/ros \
            gr-roboracer:dev bash -lc '
              set +e
              source /opt/ros/jazzy/setup.bash
              source /opt/racing_underlay/setup.bash
              colcon build --base-paths ros_ws/src --symlink-install || exit 1
              source install/setup.bash
              fails=0
              for i in $(seq 1 20); do
                echo "=== lap $i"
                robot --pythonpath tests/lib --outputdir log/robot/run-$i \
                  --test "Vehicle Completes Baseline Lap Safely" \
                  tests/acceptance > log/robot-$i.txt 2>&1
                code=$?
                if [ $code -ne 0 ]; then
                  fails=$((fails+1))
                  echo "LAP $i FAILED (exit $code)"
                  grep -h "TimeoutError" log/robot-$i.txt
                fi
                pkill -f install/racing_ ; sleep 1
              done
              echo "N1_REPRO_FAILS=$fails of 20"
              exit 0
            '

      - name: Upload node and Robot logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n1-repro-leg-${{ matrix.leg }}
          path: |
            log/ros/
            log/robot/
            log/robot-*.txt
          if-no-files-found: warn
