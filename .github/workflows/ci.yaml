# Two gates, deliberately unequal.
#
# The PR gate is small on purpose: tiers 0-2 plus one seeded tier-3 lap, aimed
# at ~3 minutes. "Everything on every PR" was considered and rejected -- at 20+
# minutes a gate gets bypassed, and a gate you bypass is worth less than a
# smaller one you don't. The nightly job is where the full tier-3/4 suites and
# the multi-seed sweep run, because that is work nobody is waiting on.
#
# Note that the local pre-commit hook (scripts/check.sh --fast) matters more
# than either job here: CI feedback arrives after a mistake has been built on.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # 03:00 UTC daily.
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-gate:
    name: Tiers 0-2 + one seeded lap
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Loaded into the local daemon rather than pushed: nothing outside this
      # job consumes the image, and the underlay layer is the expensive one to
      # rebuild, so it is the one worth caching.
      - name: Build the dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: dev
          tags: gr-roboracer:dev
          load: true
          cache-from: type=gha,scope=dev
          cache-to: type=gha,mode=max,scope=dev

      - name: check.sh --ci
        run: |
          docker run --rm \
            --volume "$PWD:/ws" \
            --workdir /ws \
            --env ROS_DOMAIN_ID=42 \
            gr-roboracer:dev ./scripts/check.sh --ci

  # Split by region of interest (owner, 2026-10-22) so a region's tier 5 grows
  # inside its own timeout: one job per region x seed. tests/nightly_regions.yaml
  # assigns every tier 3-5 test to one region and CHECK-1510 proves the union is
  # the whole nightly; `static` is tiers 0-2 and owns no test. Tiers 0-2 read
  # no seed, so they run once, on `static`/42 (owner Q-A, 2026-10-24); tiers 3-4
  # still repeat on every seed leg on purpose: that is the flake detector. The
  # short regions get 60 minutes (owner Q-B) against measured legs of at most
  # 12 minutes; slam and path_planning keep 180. path_planning_mintime (Q8) splits the
  # min-time lap and its conditional regeneration (SIM-3120, SIM-5060) from
  # path_planning so neither region's tier 5 outgrows its timeout: 120
  # minutes, against a worst case of about 63 minutes if the optimizer code
  # changed (two solves of at most MINTIME_MAX_WALL_S = 1200 s plus the
  # lap) on an ASSUMED 20 minute build/setup (E-5). That is 21 jobs.
  #
  # E-5 RECORD: the setup time of a leg (job start through the image build,
  # i.e. to the check.sh step) is written to each leg's job summary by the
  # "Build/setup seconds" step. check.sh's own colcon build is not in that
  # number: the recorded figure is that summary line PLUS the build time in
  # colcon's "Summary: N packages finished [Xs]" line in the leg's log.
  # First measured run: <not yet measured>; record the sum here from the
  # first workflow_dispatch and compare with the assumed 20 minutes.
  nightly:
    name: Nightly ${{ matrix.region }}, seed ${{ matrix.seed }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Per region, from matrix.include. Tier 5 is laps, not seconds, and it runs
    # on the seed-42 job of the region that owns it.
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        region:
          [static, slam, path_planning, path_planning_mintime, control, shared]
        # 42 and 1030 are the seeds the committed tier-3 tests pin; the others
        # exist so a controller that only survives the seeds it was tuned
        # against fails here rather than on a track.
        seed: [42, 1030, 7, 2026]
        exclude:
          - {region: static, seed: 1030}
          - {region: static, seed: 7}
          - {region: static, seed: 2026}
        include:
          - {region: static, timeout: 60}
          - {region: slam, timeout: 180}
          - {region: path_planning, timeout: 180}
          - {region: path_planning_mintime, timeout: 120}
          - {region: control, timeout: 60}
          - {region: shared, timeout: 60}
    steps:
      - name: Start the build/setup clock
        run: echo "NIGHTLY_T0=$(date +%s)" >> "$GITHUB_ENV"

      # The submodule is read only by SIM-5050's upstream reference row, so
      # only the path_planning legs fetch it (third_party/NOTICE.md).
      - uses: actions/checkout@v4
        with:
          submodules: ${{ matrix.region == 'path_planning' }}

      - uses: docker/setup-buildx-action@v3

      # Only one job exports the layer cache, so twenty-one concurrent jobs do not
      # write it at once; every job reads it.
      - name: Build the dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: dev
          tags: gr-roboracer:dev
          load: true
          cache-from: type=gha,scope=dev
          cache-to: ${{ (matrix.region == 'static' && matrix.seed == 42) && 'type=gha,mode=max,scope=dev' || '' }}

      - name: Build/setup seconds (E-5)
        run: |
          echo "Build/setup seconds, job start to check.sh: $(( $(date +%s) - NIGHTLY_T0 ))" >> "$GITHUB_STEP_SUMMARY"

      # NIGHTLY_TIER5 crosses into the container only through --env: a step
      # `env:` sets it on the runner, not inside `docker run`.
      - name: check.sh --nightly-region ${{ matrix.region }}
        run: |
          docker run --rm \
            --volume "$PWD:/ws" \
            --workdir /ws \
            --env ROS_DOMAIN_ID=42 \
            --env ROS_LOG_DIR=/ws/log/ros \
            --env NIGHTLY_TIER5=${{ matrix.seed == 42 && '1' || '0' }} \
            gr-roboracer:dev ./scripts/check.sh --nightly-region ${{ matrix.region }}

      - name: Upload SIM-5030's sample
        if: always() && matrix.region == 'slam' && matrix.seed == 42
        uses: actions/upload-artifact@v4
        with:
          name: sim-5030
          path: |
            log/sim-5030.json
            log/sim-5030-max.jsonl
          if-no-files-found: ignore

      # Tier 5 runs on seed 42 only (NIGHTLY_TIER5 above), so SIM-5040/5050
      # write the report on path_planning/42 alone.
      - name: Upload the raceline comparison report
        if: always() && matrix.region == 'path_planning' && matrix.seed == 42
        uses: actions/upload-artifact@v4
        with:
          name: raceline-report
          path: log/raceline-report/
          if-no-files-found: ignore

      # SIM-5060's record: regenerated or not, and why (it runs only when the
      # optimizer code changed, Q8), with the IPOPT outcome when it ran.
      - name: Upload the min-time regeneration record
        if: always() && matrix.region == 'path_planning_mintime' && matrix.seed == 42
        uses: actions/upload-artifact@v4
        with:
          name: raceline-mintime-regeneration
          path: log/raceline-report/regeneration-mintime.json
          if-no-files-found: ignore

      # SIM-5510 is tier 5, so it runs on slam/42 alone and writes there.
      - name: Upload the pose-source report
        if: always() && matrix.region == 'slam' && matrix.seed == 42
        uses: actions/upload-artifact@v4
        with:
          name: pose-source-report
          path: log/pose-source-report/
          if-no-files-found: ignore

      # After check.sh, whose build produced the overlay the lap needs (the
      # bind mount carries build/ and install/ across).
      - name: One seeded lap on this matrix seed
        if: matrix.region == 'control'
        run: |
          docker run --rm \
            --volume "$PWD:/ws" \
            --workdir /ws \
            --env ROS_DOMAIN_ID=42 \
            --env ROS_LOG_DIR=/ws/log/ros \
            gr-roboracer:dev ./scripts/run_scenario.py \
              --seed ${{ matrix.seed }} \
              --output log/scenario-seed-${{ matrix.seed }}.json

      # Node logs and Robot Framework output, kept only for a red job. The CI
      # log carries no node output, so a latched stop on a runner left no
      # evidence beyond the observer's one-line description.
      - name: Upload the failed run's node and Robot logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.region }}-seed-${{ matrix.seed }}
          path: |
            log/ros/
            log/robot/
          if-no-files-found: warn

      - name: Upload the run's metrics
        if: always() && matrix.region == 'control'
        uses: actions/upload-artifact@v4
        with:
          name: scenario-seed-${{ matrix.seed }}
          path: log/scenario-seed-${{ matrix.seed }}.json
          if-no-files-found: warn
