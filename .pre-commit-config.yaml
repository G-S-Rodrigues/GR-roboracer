exclude: ^\.scratch/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-json
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]

  - repo: local
    hooks:
      - id: tiers-0-1
        name: build, lint, and tier 1 tests
        entry: ./scripts/check.sh --fast
        language: system
        pass_filenames: false
        always_run: true
