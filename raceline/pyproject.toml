[project]
name = "gr-roboracer-raceline"
version = "0.1.0"
description = "ROS-free offline raceline generation for GR-roboracer"
requires-python = ">=3.12,<3.14"
# TUM's optimizer does not live here: it runs in the isolated py3.8 project
# tum_env/ (see README.md), reached through raceline.tum as a subprocess.
dependencies = [
  "numpy>=2,<3",
  "pyyaml>=6,<7",
  "scipy>=1.13,<2",
  "scikit-image>=0.24,<1",
  "opencv-python-headless>=4.10,<5",
  "matplotlib>=3.9,<4",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["raceline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
