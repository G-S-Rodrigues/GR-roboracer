[project]
name = "tum-env"
version = "0.0.0"
description = "Isolated Python 3.8 env for ForzaETH global_racetrajectory_optimization"
requires-python = "==3.8.*"
# ForzaETH pip_package requirements.txt pins, with two exceptions (see
# ../README.md): trajectory-planning-helpers 0.78 (0.76/0.77 lack the
# spline_len argument TUM's code passes) and quadprog >=0.1.8 (0.1.7 builds
# from sdist but fails to import).
# The package is the owner's fork (R-FORK), pinned by full SHA: fork main
# after PR #2 (part 8F; min-time, seeded, exact arc length, periodic speed).
dependencies = [
  "global-racetrajectory-optimization @ git+https://github.com/G-S-Rodrigues/GR-roboracer-global_racetrajectory_optimization@8bedf4ca460c37efec2af251ce1ccd17ef377db2",
  "numpy==1.18.1",
  "scipy==1.3.3",
  "casadi==3.5.1",
  "matplotlib==3.3.1",
  "scikit-learn==0.23.1",
  "trajectory-planning-helpers==0.78",
]

[tool.uv]
package = false
override-dependencies = ["quadprog>=0.1.8"]

[tool.ruff]
extend = "../../ruff.toml"
target-version = "py38"
